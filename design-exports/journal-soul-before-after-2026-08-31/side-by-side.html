<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oneiros Journal — app before and after</title>
    <style>
      :root {
        --paper: #f8f3ea;
        --surface: #fffdf9;
        --ink: #2d2430;
        --muted: #6f6473;
        --line: rgba(101, 68, 111, 0.22);
        --before: #8b5a62;
        --after: #526b5d;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); }
      body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: 920px; padding: 28px 32px 34px; }
      h1 { margin: 0 0 7px; font: 700 31px/1.12 Georgia, serif; }
      .note { margin: 0 0 20px; color: var(--muted); font-size: 15px; line-height: 1.45; }
      .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      figure { margin: 0; padding: 13px 13px 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
      figcaption { display: flex; align-items: center; gap: 8px; margin: 0 0 11px; font-size: 12px; font-weight: 700; letter-spacing: 0.075em; text-transform: uppercase; }
      .marker { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }
      .before { color: var(--before); }
      .after { color: var(--after); }
      img { display: block; width: 390px; height: 844px; border-radius: 13px; box-shadow: 0 4px 20px rgba(45, 36, 48, 0.08); }
    </style>
  </head>
  <body>
    <main>
      <h1>Journal — authored gesture pass</h1>
      <p class="note">Actual Oneiros app captures at 390 × 844. The after icon keeps the light open-book concept, restores subtle ink-drawn character, and contains no witness dot.</p>
      <section class="comparison">
        <figure>
          <figcaption class="before"><span class="marker"></span>Before — clean but safe</figcaption>
          <img src="/journal-soul-before-after-2026-08-31/01-before-app-390x844.png" alt="Journal before authored gesture pass" />
        </figure>
        <figure>
          <figcaption class="after"><span class="marker"></span>After — authored, no dot</figcaption>
          <img src="/journal-soul-before-after-2026-08-31/02-after-app-390x844.png" alt="Journal after authored gesture pass" />
        </figure>
      </section>
    </main>
  </body>
</html>
